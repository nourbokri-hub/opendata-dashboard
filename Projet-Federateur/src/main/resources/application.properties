# Port du serveur
server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/dashboarddb}
spring.data.mongodb.auto-index-creation=true


# MySQL

# JPA / Hibernate

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- CONFIGURATION UPLOAD (Vital pour éviter CONNECTION_RESET) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# --- Default Admin (for dashboard admin) ---
admin.email=${ADMIN_EMAIL:admin@opendata.tn}
admin.password=${ADMIN_PASSWORD}
admin.name=${ADMIN_NAME:Administrateur}
